<!doctype html>
<html lang="en" data-theme="light">

<head>
  <meta charset="utf-8" />
  <title>Sign In – Coderefine</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0" />
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <link rel="stylesheet" href="./styles.css?v=2" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Mono&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./config.js"></script>
  <!-- config.local.js is gitignored; when present locally it overrides config.js -->
  <script>fetch('./config.local.js').then(r=>r.ok&&r.text()).then(t=>t&&new Function(t)()).catch(()=>{})</script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
    }

    body {
      background-color: #ffffff;
      min-height: 100vh;
      display: flex;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      color: #000000;
    }

    #auth-root {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      width: 100%;
      padding: 20px;
    }

    .auth-container {
      width: 100%;
      max-width: 440px;
    }

    .auth-header {
      text-align: center;
      margin-bottom: 40px;
    }

    .auth-header-row {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
    }

    .auth-logo {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      background: #000000;
      color: white;
      border-radius: 6px;
      font-family: 'Space Mono', monospace;
      font-size: 16px;
      font-weight: bold;
      padding-bottom: 2px;
      margin-right: 12px;
      vertical-align: middle;
    }

    .auth-title {
      font-size: 28px;
      font-weight: 800;
      color: #000000;
      margin: 0;
      letter-spacing: -0.04em;
    }

    .auth-subtitle {
      font-size: 15px;
      color: #666666;
    }

    .auth-card {
      background: #ffffff;
      border: 1px solid #eaeaea;
      border-radius: 16px;
      padding: 40px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.04);
    }

    .auth-form {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .auth-field {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .auth-field label {
      font-size: 13px;
      font-weight: 600;
      color: #666666;
    }

    .auth-field input {
      padding: 12px 16px;
      background: #ffffff;
      border: 1px solid #eaeaea;
      border-radius: 8px;
      color: #000000;
      font-size: 15px;
      font-family: inherit;
      transition: all 0.2s;
    }

    .auth-field input::placeholder {
      color: #999999;
    }

    .auth-field input:focus {
      outline: none;
      border-color: #000000;
    }

    .auth-submit {
      padding: 14px 24px;
      background: #111111;
      border: 1px solid #111111;
      border-radius: 8px;
      color: white;
      font-weight: 600;
      font-family: inherit;
      font-size: 15px;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 8px;
    }

    .auth-submit:hover:not(:disabled) {
      background: #333333;
    }

    .auth-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      color: #666666;
    }

    .checkbox-group input[type="checkbox"] {
      width: 16px;
      height: 16px;
      cursor: pointer;
      accent-color: #000000;
    }

    .forgot-link {
      font-size: 13px;
      color: #000000;
      text-decoration: none;
      cursor: pointer;
      font-weight: 500;
    }

    .forgot-link:hover {
      text-decoration: underline;
    }

    .auth-divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 28px 0;
      color: #999999;
      font-size: 13px;
      font-weight: 500;
    }

    .auth-divider::before,
    .auth-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #eaeaea;
    }

    .auth-oauth-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .auth-oauth-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 16px;
      background: #ffffff;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      color: #000000;
      font-weight: 500;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }

    .auth-oauth-btn:hover {
      background: #f9f9f9;
      border-color: #d0d0d0;
    }

    .auth-mode-switch {
      text-align: center;
      margin-top: 24px;
      font-size: 14px;
      color: #666666;
    }

    .auth-mode-switch a {
      color: #000000;
      text-decoration: none;
      font-weight: 600;
      cursor: pointer;
    }

    .auth-mode-switch a:hover {
      text-decoration: underline;
    }

    .auth-back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #666666;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 28px;
      cursor: pointer;
    }

    .auth-back-link:hover {
      color: #000000;
    }

    #auth-message {
      padding: 14px 16px;
      border-radius: 8px;
      font-size: 14px;
      margin-top: 20px;
      display: none;
      text-align: center;
    }

    #auth-message.show {
      display: block;
    }

    #auth-message.error {
      background: #fee2e2;
      color: #dc2626;
      border: 1px solid #f87171;
    }

    #auth-message.success {
      background: #dcfce7;
      color: #16a34a;
      border: 1px solid #86efac;
    }

    #auth-signup-mode,
    #auth-forgot-mode {
      display: none;
    }

    .auth-page-title {
      font-size: 24px;
      font-weight: 700;
      color: #000000;
      margin-bottom: 24px;
      letter-spacing: -0.02em;
    }

    @media (max-width: 480px) {
      .auth-card {
        padding: 24px;
      }
      .auth-oauth-row {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <!-- Auth Container -->
  <div id="auth-root">
    <div class="auth-container">
      <!-- Header -->
      <div class="auth-header">
        <div class="auth-header-row">
          <div class="auth-logo">{}</div>
          <h1 class="auth-title">CodeRefine</h1>
        </div>
        <p class="auth-subtitle">AI-powered code refinement workbench</p>
      </div>

      <!-- Auth Card -->
      <div class="auth-card">
        <div id="auth-forms-container">

          <!-- LOGIN MODE -->
          <div id="auth-login-mode">
            <form id="auth-login-form" class="auth-form">
              <div class="auth-field">
                <label>Email Address</label>
                <input id="login-email" type="email" autocomplete="email" placeholder="you@example.com" required />
              </div>
              <div class="auth-field">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                  <label>Password</label>
                  <a onclick="switchMode('forgot')" class="forgot-link">Forgot?</a>
                </div>
                <input id="login-password" type="password" autocomplete="current-password" placeholder="••••••••" required />
              </div>
              <div class="checkbox-group">
                <input id="login-remember" type="checkbox" />
                <label style="cursor: pointer; margin: 0;">Remember me</label>
              </div>
              <button type="submit" class="auth-submit" id="btn-login-submit">Sign In</button>
            </form>

            <div class="auth-divider">or continue with</div>

            <div class="auth-oauth-row">
              <button type="button" class="auth-oauth-btn btn-google-login" id="btn-google-login">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" style="flex-shrink:0">
                  <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4" />
                  <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853" />
                  <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05" />
                  <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335" />
                </svg>
                Google
              </button>
              <button type="button" class="auth-oauth-btn btn-github-login" id="btn-github-login">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" style="flex-shrink:0">
                  <path d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z" />
                </svg>
                GitHub
              </button>
            </div>

            <div class="auth-mode-switch">
              Don't have an account? <a onclick="switchMode('signup')">Sign up</a>
            </div>
          </div>

          <!-- SIGNUP MODE -->
          <div id="auth-signup-mode">
            <a onclick="switchMode('login')" class="auth-back-link">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <polyline points="15 18 9 12 15 6" />
              </svg>
              Back to Sign In
            </a>

            <h2 class="auth-page-title">Create your account</h2>

            <form id="auth-signup-form" class="auth-form">
              <div class="auth-field">
                <label>Email Address</label>
                <input id="signup-email" type="email" autocomplete="email" placeholder="you@example.com" required />
              </div>
              <div class="auth-field">
                <label>Password</label>
                <input id="signup-password" type="password" autocomplete="new-password" placeholder="••••••••" required />
              </div>
              <button type="submit" class="auth-submit" id="btn-signup-submit">Create Account</button>
            </form>

            <div class="auth-divider">or continue with</div>

            <div class="auth-oauth-row">
              <button type="button" class="auth-oauth-btn btn-google-login">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" style="flex-shrink:0">
                  <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4" />
                  <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853" />
                  <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05" />
                  <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335" />
                </svg>
                Google
              </button>
              <button type="button" class="auth-oauth-btn btn-github-login">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" style="flex-shrink:0">
                  <path d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z" />
                </svg>
                GitHub
              </button>
            </div>

            <div class="auth-mode-switch">
              Already have an account? <a onclick="switchMode('login')">Sign in</a>
            </div>
          </div>

          <!-- FORGOT PASSWORD MODE -->
          <div id="auth-forgot-mode">
            <a onclick="switchMode('login')" class="auth-back-link">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <polyline points="15 18 9 12 15 6" />
              </svg>
              Back to Sign In
            </a>

            <h2 class="auth-page-title">Reset your password</h2>

            <form id="auth-forgot-form" class="auth-form">
              <div class="auth-field">
                <label>Email Address</label>
                <input id="forgot-email" type="email" autocomplete="email" placeholder="you@example.com" required />
              </div>
              <button type="submit" class="auth-submit" id="btn-forgot-submit">Send Reset Link</button>
            </form>

            <div class="auth-mode-switch">
              Remember your password? <a onclick="switchMode('login')">Sign in</a>
            </div>
          </div>

        </div>

        <!-- Message Container -->
        <div id="auth-message" aria-live="polite"></div>
      </div>
    </div>
  </div>

  <script src="./auth.js"></script>
</body>

</html>
