services:
  - type: web
    name: coderefine-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false   # Set manually in Render dashboard
      - key: SUPABASE_URL
        sync: false   # Set manually in Render dashboard
      - key: SUPABASE_ANON_KEY
        sync: false   # Set manually in Render dashboard
      - key: ALLOWED_ORIGINS
        sync: false   # e.g. https://your-project.vercel.app
